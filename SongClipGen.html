<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Christmas Audio Clipper 🎄</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --green: #1b4332;
        --green-light: #2d6a4f;
        --red: #d00000;
        --cream: #fdf7ec;
        --gold: #e9c46a;
      }

      * {
        box-sizing: border-box;
      }
      .top-nav {
        width: 100%;
        background: var(--cream);
        border-bottom: 3px solid var(--green);
        padding: 0.5rem 0;
        position: sticky;
        top: 0;
        z-index: 50;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        margin-bottom: 100px;
        border-radius: 10px;
      }

      .nav-inner {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 1rem;
        display: flex;
        justify-content: center;
        gap: 1.75rem;
      }

      .nav-link {
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        padding: 0.35rem 0.6rem;
        border-radius: 6px;
        color: var(--green);
        transition: background 0.15s ease, color 0.15s ease;
      }

      .nav-link:hover {
        background: rgba(0, 0, 0, 0.05);
        color: var(--green-light);
      }

      /* Active page highlights */
      .nav-link.active {
        background: linear-gradient(135deg, var(--green-light), var(--green));
        color: #fff !important;
        box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18);
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: start;
        padding: 1.5rem;
        background: radial-gradient(
            circle at 10% 20%,
            rgba(255, 255, 255, 0.2) 0,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 10%,
            rgba(255, 255, 255, 0.16) 0,
            transparent 45%
          ),
          radial-gradient(
            circle at 20% 80%,
            rgba(255, 255, 255, 0.14) 0,
            transparent 45%
          ),
          #0b1b2a;
        color: #fdfdfd;
      }

      .card {
        width: 100%;
        max-width: 420px;
        background: var(--cream);
        color: #222;
        border-radius: 16px;
        padding: 1.5rem 1.25rem 1.25rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        border: 3px solid var(--green);
        position: relative;
        overflow: hidden;
      }

      /* Simple string lights at the top */
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -10%;
        width: 120%;
        height: 18px;
        background-image: radial-gradient(circle, #ffccd5 3px, transparent 4px),
          radial-gradient(circle, #ffe169 3px, transparent 4px),
          radial-gradient(circle, #b7e4c7 3px, transparent 4px),
          radial-gradient(circle, #f28f3b 3px, transparent 4px);
        background-size: 26px 18px;
        background-position: 0 4px, 8px 4px, 16px 4px, 24px 4px;
        background-repeat: repeat-x;
        pointer-events: none;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.4rem;
        text-align: center;
        color: var(--green);
      }

      .subtitle {
        margin: 0 0 1.25rem;
        font-size: 0.9rem;
        text-align: center;
        color: #555;
      }

      label {
        display: block;
        font-size: 0.9rem;
        margin-bottom: 0.35rem;
        font-weight: 500;
        color: #333;
      }

      input[type="file"],
      input[type="number"] {
        width: 100%;
        font-size: 0.9rem;
        padding: 0.4rem 0.5rem;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-bottom: 0.75rem;
        background-color: #fff;
      }

      input[type="number"] {
        -moz-appearance: textfield;
      }
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }

      button {
        width: 100%;
        padding: 0.55rem 0.75rem;
        font-size: 0.95rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        background: linear-gradient(135deg, var(--green-light), var(--green));
        color: #fff;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.4rem;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
        transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
      }

      button:hover {
        filter: brightness(1.05);
        transform: translateY(-1px);
        box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 3px 7px rgba(0, 0, 0, 0.3);
      }

      #status {
        margin-top: 0.6rem;
        font-size: 0.85rem;
        color: #444;
        min-height: 1.2em;
      }

      #status.ok {
        color: var(--green);
      }
      #status.error {
        color: var(--red);
      }

      .hint {
        font-size: 0.75rem;
        color: #777;
        margin-bottom: 0.5rem;
      }
    </style>
  </head>
  <body>
    <nav class="top-nav">
      <div class="nav-inner">
        <a href="index.html" class="nav-link" id="nav-home">Home</a>
        <a href="BingoCaller.html" class="nav-link" id="nav-bingo">Bingo</a>
        <a href="NameThatTune.html" class="nav-link" id="nav-tunes"
          >Name That Tune</a
        >
      </div>
    </nav>

    <div class="card">
      <h1>Christmas Audio Clipper 🎅</h1>
      <p class="subtitle">
        Trim your holiday tunes to a festive little snippet.
      </p>

      <label for="audioFile">Audio file</label>
      <input type="file" id="audioFile" accept="audio/*" />

      <label for="seconds">Clip length (seconds)</label>
      <input type="number" id="seconds" min="1" step="1" value="10" />
      <p class="hint">Your clip will start from the beginning of the track.</p>

      <button id="clipBtn">✂️ Clip &amp; Download</button>

      <p id="status"></p>
    </div>

    <script>
      const fileInput = document.getElementById("audioFile");
      const secondsInput = document.getElementById("seconds");
      const clipBtn = document.getElementById("clipBtn");
      const statusEl = document.getElementById("status");

      clipBtn.addEventListener("click", async () => {
        clearStatus();

        const file = fileInput.files[0];
        if (!file) {
          setStatus("Please select an audio file to trim. 🎁", "error");
          return;
        }

        const seconds = parseFloat(secondsInput.value);
        if (!seconds || seconds <= 0) {
          setStatus("Enter a positive number of seconds. ⏱️", "error");
          return;
        }

        setStatus("Processing your merry little clip... ❄️", "ok");

        try {
          const arrayBuffer = await file.arrayBuffer();
          const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;
          const audioCtx = new AudioContextClass();

          const decodedBuffer = await decodeAudioDataAsync(
            audioCtx,
            arrayBuffer
          );
          const clippedBuffer = clipAudioBuffer(
            decodedBuffer,
            seconds,
            audioCtx
          );
          const wavArrayBuffer = audioBufferToWav(clippedBuffer);
          const blob = new Blob([wavArrayBuffer], { type: "audio/wav" });

          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          const baseName = file.name.replace(/\.[^/.]+$/, "");
          a.href = url;
          a.download = baseName + "-clipped.wav";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);

          setStatus("Done! Your festive clip should be downloading. 🎶", "ok");
          audioCtx.close();
        } catch (err) {
          console.error(err);
          setStatus(
            "Oops, something went wrong trimming your track. 🎄",
            "error"
          );
        }
      });

      function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = type || "";
      }

      function clearStatus() {
        statusEl.textContent = "";
        statusEl.className = "";
      }

      function decodeAudioDataAsync(audioCtx, arrayBuffer) {
        return new Promise((resolve, reject) => {
          audioCtx.decodeAudioData(
            arrayBuffer,
            (buffer) => resolve(buffer),
            (error) => reject(error)
          );
        });
      }

      function clipAudioBuffer(buffer, seconds, audioCtx) {
        const sampleRate = buffer.sampleRate;
        const channels = buffer.numberOfChannels;
        const totalSamplesRequested = Math.floor(sampleRate * seconds);
        const samplesToCopy = Math.min(buffer.length, totalSamplesRequested);

        const clipped = audioCtx.createBuffer(
          channels,
          samplesToCopy,
          sampleRate
        );

        for (let ch = 0; ch < channels; ch++) {
          const sourceData = buffer.getChannelData(ch);
          const targetData = clipped.getChannelData(ch);
          targetData.set(sourceData.subarray(0, samplesToCopy));
        }

        return clipped;
      }

      function audioBufferToWav(buffer) {
        const numOfChan = buffer.numberOfChannels;
        const sampleRate = buffer.sampleRate;
        const numFrames = buffer.length;
        const bytesPerSample = 2; // 16-bit PCM
        const blockAlign = numOfChan * bytesPerSample;
        const byteRate = sampleRate * blockAlign;
        const dataSize = numFrames * blockAlign;
        const bufferLength = 44 + dataSize;

        const arrayBuffer = new ArrayBuffer(bufferLength);
        const view = new DataView(arrayBuffer);

        let offset = 0;

        function writeString(str) {
          for (let i = 0; i < str.length; i++) {
            view.setUint8(offset++, str.charCodeAt(i));
          }
        }

        function writeUint32(value) {
          view.setUint32(offset, value, true);
          offset += 4;
        }

        function writeUint16(value) {
          view.setUint16(offset, value, true);
          offset += 2;
        }

        // RIFF chunk descriptor
        writeString("RIFF");
        writeUint32(36 + dataSize); // File size - 8
        writeString("WAVE");

        // fmt sub-chunk
        writeString("fmt ");
        writeUint32(16); // Subchunk1Size (16 for PCM)
        writeUint16(1); // AudioFormat (1 = PCM)
        writeUint16(numOfChan); // NumChannels
        writeUint32(sampleRate); // SampleRate
        writeUint32(byteRate); // ByteRate
        writeUint16(blockAlign); // BlockAlign
        writeUint16(16); // BitsPerSample

        // data sub-chunk
        writeString("data");
        writeUint32(dataSize);

        // Write interleaved PCM samples
        const channelData = [];
        for (let ch = 0; ch < numOfChan; ch++) {
          channelData.push(buffer.getChannelData(ch));
        }

        for (let i = 0; i < numFrames; i++) {
          for (let ch = 0; ch < numOfChan; ch++) {
            let sample = channelData[ch][i];
            sample = Math.max(-1, Math.min(1, sample));
            const int16 = sample < 0 ? sample * 0x8000 : sample * 0x7fff;
            view.setInt16(offset, int16, true);
            offset += 2;
          }
        }

        return arrayBuffer;
      }
    </script>
  </body>
</html>
