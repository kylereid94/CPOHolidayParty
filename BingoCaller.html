<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Christmas Bingo Caller 🎄</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      :root {
        --green: #1b4332;
        --green-light: #2d6a4f;
        --red: #d00000;
        --cream: #fdf7ec;
        --gold: #e9c46a;
      }

      * {
        box-sizing: border-box;
      }

      .top-nav {
        width: 100%;
        background: var(--cream);
        border-bottom: 3px solid var(--green);
        padding: 0.5rem 0;
        position: sticky;
        top: 0;
        z-index: 50;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
        margin-bottom: 100px;
        border-radius: 10px;
      }

      .nav-inner {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 1rem;
        display: flex;
        justify-content: center;
        gap: 1.75rem;
      }

      .nav-link {
        font-size: 0.95rem;
        font-weight: 600;
        text-decoration: none;
        padding: 0.35rem 0.6rem;
        border-radius: 6px;
        color: var(--green);
        transition: background 0.15s ease, color 0.15s ease;
      }

      .nav-link:hover {
        background: rgba(0, 0, 0, 0.05);
        color: var(--green-light);
      }

      /* Active page highlights */
      .nav-link.active {
        background: linear-gradient(135deg, var(--green-light), var(--green));
        color: #fff !important;
        box-shadow: 0 3px 7px rgba(0, 0, 0, 0.18);
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: start;
        padding: 1.5rem;
        background: radial-gradient(
            circle at 10% 20%,
            rgba(255, 255, 255, 0.2) 0,
            transparent 40%
          ),
          radial-gradient(
            circle at 80% 10%,
            rgba(255, 255, 255, 0.16) 0,
            transparent 45%
          ),
          radial-gradient(
            circle at 20% 80%,
            rgba(255, 255, 255, 0.14) 0,
            transparent 45%
          ),
          #0b1b2a;
        color: #fdfdfd;
      }

      .card {
        width: 100%;
        max-width: 520px;
        background: var(--cream);
        color: #222;
        border-radius: 16px;
        padding: 1.5rem 1.25rem 1.25rem;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        border: 3px solid var(--green);
        position: relative;
        overflow: hidden;
      }

      /* String lights */
      .card::before {
        content: "";
        position: absolute;
        top: 0;
        left: -10%;
        width: 120%;
        height: 18px;
        background-image: radial-gradient(circle, #ffccd5 3px, transparent 4px),
          radial-gradient(circle, #ffe169 3px, transparent 4px),
          radial-gradient(circle, #b7e4c7 3px, transparent 4px),
          radial-gradient(circle, #f28f3b 3px, transparent 4px);
        background-size: 26px 18px;
        background-position: 0 4px, 8px 4px, 16px 4px, 24px 4px;
        background-repeat: repeat-x;
        pointer-events: none;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.4rem;
        text-align: center;
        color: var(--green);
      }

      .subtitle {
        margin: 0 0 1.25rem;
        font-size: 0.9rem;
        text-align: center;
        color: #555;
      }

      #status {
        margin-bottom: 0.5rem;
        font-size: 0.85rem;
        color: #444;
        min-height: 1.2em;
      }

      #status.ok {
        color: var(--green);
      }
      #status.error {
        color: var(--red);
      }

      .current-call {
        background: #ffffff;
        border-radius: 12px;
        padding: 0.9rem 0.8rem;
        margin-bottom: 0.9rem;
        border: 1px dashed rgba(0, 0, 0, 0.15);
        text-align: center;
      }

      .current-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #777;
        margin-bottom: 0.25rem;
      }

      .current-text {
        font-size: 1.3rem;
        font-weight: 700;
        color: var(--red);
        min-height: 1.6em;
        word-break: break-word;
      }

      .controls {
        display: flex;
        gap: 0.6rem;
        margin-bottom: 0.9rem;
      }

      button {
        flex: 1 1 0;
        padding: 0.55rem 0.75rem;
        font-size: 0.9rem;
        border-radius: 999px;
        border: none;
        cursor: pointer;
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.35rem;
        box-shadow: 0 3px 9px rgba(0, 0, 0, 0.2);
        transition: transform 0.1s ease, box-shadow 0.1s ease, filter 0.1s ease;
        white-space: nowrap;
      }

      button:disabled {
        opacity: 0.55;
        cursor: default;
        box-shadow: none;
        transform: none;
      }

      button.primary {
        background: linear-gradient(135deg, var(--green-light), var(--green));
        color: #fff;
      }

      button.secondary {
        background: linear-gradient(135deg, #f7b267, #f77f00);
        color: #fff;
      }

      button:hover:not(:disabled) {
        filter: brightness(1.05);
        transform: translateY(-1px);
        box-shadow: 0 5px 13px rgba(0, 0, 0, 0.25);
      }

      button:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 3px 7px rgba(0, 0, 0, 0.3);
      }

      .counts {
        font-size: 0.8rem;
        color: #666;
        margin-bottom: 0.6rem;
        text-align: right;
      }

      .log-container {
        border-radius: 10px;
        border: 1px solid rgba(0, 0, 0, 0.1);
        background: #fffefa;
        max-height: 260px;
        overflow-y: auto;
        padding: 0.5rem 0.4rem;
      }

      .log-title {
        font-size: 0.85rem;
        font-weight: 600;
        color: #444;
        margin: 0 0 0.2rem;
        padding: 0 0.15rem;
      }

      ul#drawLog {
        list-style: none;
        margin: 0;
        padding: 0;
        font-size: 0.85rem;
      }

      .log-item {
        display: flex;
        align-items: baseline;
        gap: 0.4rem;
        padding: 0.2rem 0.2rem;
        border-bottom: 1px solid rgba(0, 0, 0, 0.04);
      }

      .log-item:last-child {
        border-bottom: none;
      }

      .log-index {
        font-weight: 600;
        color: var(--green);
        min-width: 1.4em;
        text-align: right;
      }

      .log-text {
        flex: 1 1 auto;
        word-break: break-word;
      }

      .footer-note {
        margin-top: 0.65rem;
        font-size: 0.75rem;
        text-align: center;
        color: #777;
      }

      .footer-note a {
        color: var(--green-light);
        text-decoration: none;
        font-weight: 500;
      }

      .footer-note a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <nav class="top-nav">
      <div class="nav-inner">
        <a href="index.html" class="nav-link" id="nav-home">Home</a>
        <a href="BingoCaller.html" class="nav-link active" id="nav-bingo"
          >Holiday Bingo</a
        >
        <a href="NameThatTune.html" class="nav-link" id="nav-tunes"
          >Name That Tune</a
        >
      </div>
    </nav>
    <div class="card">
      <h1>Christmas Bingo Caller 🎅</h1>
      <p class="subtitle">
        Draw random festive prompts for your holiday bingo game.
      </p>

      <p id="status"></p>

      <div class="current-call">
        <div class="current-label">Current Call</div>
        <div id="currentCall" class="current-text">—</div>
      </div>

      <div class="controls">
        <button id="drawBtn" class="primary" type="button">🎁 Draw</button>
        <button id="resetBtn" class="secondary" type="button">🔁 Reset</button>
      </div>

      <div id="counts" class="counts"></div>

      <div class="log-container">
        <p class="log-title">Draw Log</p>
        <ul id="drawLog"></ul>
      </div>
    </div>

    <script>
      const statusEl = document.getElementById("status");
      const currentCallEl = document.getElementById("currentCall");
      const drawBtn = document.getElementById("drawBtn");
      const resetBtn = document.getElementById("resetBtn");
      const drawLogEl = document.getElementById("drawLog");
      const countsEl = document.getElementById("counts");

      let allItems = [];
      let remainingItems = [];
      let drawnItems = [];

      async function loadBingoItems() {
        setStatus("Loading bingo items... 🎄", "ok");
        try {
          // Adjust path if needed (this expects /content/bingo.json)
          const res = await fetch("./content/bingo.json");
          if (!res.ok) {
            throw new Error("HTTP " + res.status);
          }
          const data = await res.json();
          const items = Array.isArray(data) ? data : [];

          allItems = items
            .map((item) =>
              item && item.ItemName ? String(item.ItemName) : null
            )
            .filter(Boolean);

          if (allItems.length === 0) {
            setStatus(
              "No items found in bingo.json. Add some ItemName entries. 🎅",
              "error"
            );
            drawBtn.disabled = true;
            return;
          }

          resetGame(false);
          setStatus("Ready! Click Draw to start calling items. ❄️", "ok");
        } catch (err) {
          console.error(err);
          setStatus(
            "Couldn't load /content/bingo.json. Check the file path & JSON. 🎁",
            "error"
          );
          drawBtn.disabled = true;
        }
      }

      function setStatus(message, type) {
        statusEl.textContent = message;
        statusEl.className = type || "";
      }

      function updateCounts() {
        if (!allItems.length) {
          countsEl.textContent = "";
          return;
        }
        countsEl.textContent = `Drawn ${drawnItems.length} of ${allItems.length}`;
      }

      function drawItem() {
        if (!remainingItems.length) {
          setStatus(
            "All items have been drawn! Reset to start again. 🎉",
            "ok"
          );
          drawBtn.disabled = true;
          return;
        }

        const idx = Math.floor(Math.random() * remainingItems.length);
        const [item] = remainingItems.splice(idx, 1);
        drawnItems.push(item);

        currentCallEl.textContent = item;
        setStatus("New call drawn! 🎄", "ok");

        addToLog(item, drawnItems.length);
        updateCounts();

        if (!remainingItems.length) {
          setStatus("That was the last item in the bag! 🎅", "ok");
          drawBtn.disabled = true;
        }
      }

      function addToLog(text, index) {
        const li = document.createElement("li");
        li.className = "log-item";

        const idxSpan = document.createElement("span");
        idxSpan.className = "log-index";
        idxSpan.textContent = index + ".";

        const textSpan = document.createElement("span");
        textSpan.className = "log-text";
        textSpan.textContent = text;

        li.appendChild(idxSpan);
        li.appendChild(textSpan);
        drawLogEl.appendChild(li);

        // Scroll to bottom so newest draw is visible
        li.parentElement.scrollTop = li.parentElement.scrollHeight;
      }

      function resetGame(showMessage = true) {
        remainingItems = [...allItems];
        drawnItems = [];
        currentCallEl.textContent = "—";
        drawLogEl.innerHTML = "";
        drawBtn.disabled = !remainingItems.length;
        updateCounts();
        if (showMessage) {
          setStatus("Game reset. All items back in the bag. 🎁", "ok");
        }
      }

      drawBtn.addEventListener("click", drawItem);
      resetBtn.addEventListener("click", () => resetGame(true));

      // Kick off load
      loadBingoItems();
    </script>
  </body>
</html>
